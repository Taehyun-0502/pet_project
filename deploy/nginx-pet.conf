# pet_project nginx 설정 — EC2에 /etc/nginx/conf.d/pet.conf 로 설치한다.
# `__DOMAIN__`을 실제 도메인으로 바꾼 뒤 certbot을 돌리면 certbot이 ssl_* 줄과 80→443 리다이렉트를
# 자동으로 채워 넣는다 (docs/deploy-ec2.md 4절).
#
# **프론트와 API를 같은 오리진에 둔다**는 것이 이 설정의 핵심 결정이다:
#   https://__DOMAIN__/        → 정적 파일(Vite dist)
#   https://__DOMAIN__/api/... → 백엔드 8080
# 그래서 (1) CORS가 사실상 필요 없고 (2) 리프레시 쿠키의 SameSite=Strict를 그대로 유지할 수 있다 —
# 다른 도메인에 나누면 SameSite=None으로 내려가면서 CSRF 방어가 사라진다(백로그 36번, api-spec 6절).

server {
    listen 80;
    server_name __DOMAIN__;

    # certbot이 이 블록에 80→443 리다이렉트를 추가한다.
    # 인증서 갱신용 challenge 경로는 그대로 열어 둔다
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    # certbot --nginx 가 아래 두 줄을 채운다 (수동 설치 시 경로 직접 지정)
    # ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    root /var/www/pet-frontend;
    index index.html;

    # 업로드 한도 — **기본값 1MB면 사진·영상 업로드가 413으로 죽는다.**
    # 백엔드 multipart 한도(60MB)와 맞춘다. 이 줄이 없으면 nginx가 요청을 잘라
    # 서버 로그에는 아무것도 남지 않는다(원인 추적이 어려운 대표적 배포 함정)
    client_max_body_size 60M;

    # SPA fallback — /chat/rooms/2 같은 경로로 직접 들어와도 index.html을 준다.
    # 없으면 새로고침·공유 링크가 전부 nginx 404가 된다 (백로그 48번 계열)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산은 파일명에 해시가 붙으므로 길게 캐시. index.html은 위 location에서 no-cache 기본
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # https를 백엔드에 알린다 (application-prod의 forward-headers-strategy와 짝)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (STOMP 채팅) — 이 블록이 프로젝트에서 가장 자주 사고가 나는 자리다
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Upgrade·Connection 헤더가 없으면 핸드셰이크가 101로 올라가지 못하고,
        # REST는 정상인데 **실시간만 조용히 죽는다**(새로고침해야 메시지가 보이는 증상 —
        # 이 프로젝트에서 이미 두 번 겪은 계열, 백로그 65번·roadmap 17번)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # STOMP 하트비트를 쓰지 않으므로(CONNECTED heart-beat:0,0) 기본 60초 타임아웃이면
        # 조용한 방의 연결이 1분마다 끊긴다. 클라이언트 자동 재연결이 복구하지만
        # 그때마다 복구 조회가 돌아 낭비다 — 타임아웃을 늘려 유지한다
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
