plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pet'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// Spring AI BOM — Boot 3.5.x와 짝인 1.1.x 라인 중 최신 안정판(1.1.8)을 사용한다.
// (2026-08-24 확인: spring-ai-starter-mcp-server 1.1.8의 pom이 spring-boot-starter 3.5.15를
// 관리하고 있어 우리 Boot 3.5.16과 같은 패치 계열 — Spring AI 2.0.x는 Boot 4 계열용이라 제외)
ext {
	set('springAiVersion', '1.1.8')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// 채팅 실시간 수신 (STOMP over WebSocket) — docs/api-spec.md 7절
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	// JWT 생성·서명·파싱 (api는 컴파일 타임, impl/jackson은 런타임에만 필요)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	runtimeOnly 'org.postgresql:postgresql'
	// AI 챗봇(멤버 4): Claude API 공식 Java SDK
	implementation 'com.anthropic:anthropic-java:2.52.0'
	// 장소 검색(카카오) 결과 단기 캐시 (TTL) — 카카오 약관상 DB 영구 저장 금지
	implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
	// MCP 대화형 입구(멤버 4, 2026-08-24 기획) — Claude Desktop 등 MCP 호스트에 stdio로 도구 노출
	implementation 'org.springframework.ai:spring-ai-starter-mcp-server'
	// 원격 커넥터 전환 1차(2026-08-24) — 같은 도구를 HTTP(SSE)로도 노출하는 mcp-http 프로파일용.
	// 기본 프로파일에는 spring.ai.mcp.server.enabled=false로 차단해 두므로 이 스타터를 추가해도
	// 팀원 일반 bootRun에는 영향이 없다 (application.properties · McpHttpDefaultProfileIsolationTest 참고)
	implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
