# 배포(EC2) 전용 설정 — application.properties 위에 덮어쓴다.
# 활성화 방법: systemd 유닛의 `--spring.profiles.active=prod` (deploy/pet-backend.service)
# **로컬 개발은 이 파일의 영향을 받지 않는다** — 그래서 배포만 엄격하게 조일 수 있다.

# 실행 SQL을 stdout에 쏟지 않는다 (리뷰 백로그 9번).
# journald에 쿼리가 그대로 쌓이면 디스크(프리티어 EBS)와 성능 양쪽에 부담이다
spring.jpa.show-sql=false

# 스키마 드리프트를 **부팅 시점에** 잡는다 (리뷰 백로그 93번).
# 엔티티에 컬럼이 늘었는데 Supabase ALTER를 잊었다면 배포가 여기서 실패한다 —
# 지금처럼 none이면 배포는 성공하고 **런타임에 그 기능만** 터진다(원인 추적이 훨씬 어렵다).
# 로컬은 none 그대로라 팀원 개발이 막히지 않는다(93번을 전역으로 올리지 않은 이유)
spring.jpa.hibernate.ddl-auto=validate

# nginx 리버스 프록시 뒤에서 https를 인식한다 — 서버가 만드는 URL·리다이렉트가 http로 새지 않게
server.forward-headers-strategy=framework

# 커넥션 풀 — 팀 공용 Supabase를 개발자 4명과 **함께** 쓰므로 배포 몫을 3으로 제한한다.
# 트랜잭션 풀러(6543)를 쓰고 있어 세션 슬롯을 계속 점유하지는 않는다.
# 백로그 94번(로컬이 2인 것이 의도인지) 답변이 오면 로컬 값과 함께 재조정할 것
spring.datasource.hikari.maximum-pool-size=3
