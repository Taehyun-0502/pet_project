# MCP 대화형 입구 — HTTP(SSE) 전송 프로파일 (원격 커넥터 전환 1차, 루트 CLAUDE.md
# "원격 커넥터 전환 — 단계 기획" ① 항목). 목표는 "배포만 하면 커스텀 커넥터로 등록 가능한
# 서버" 상태를 만드는 것 — 실제 배포(도메인·TLS)와 인증 구현(비밀 경로 URL/OAuth)은 2차
# 범위라 이 프로파일에는 포함하지 않는다.
#
# mcp(stdio) 프로파일과는 상호 배타적으로 쓴다 — 이 파일은 --spring.profiles.active=mcp-http
# 로 켤 때만 적용되고, 일반 bootRun(기본 프로파일)에는 전혀 영향이 없다
# (application.properties의 spring.ai.mcp.server.enabled=false 기본 차단을 여기서만 다시 켠다.
# 증명: McpHttpDefaultProfileIsolationTest는 기본 프로파일에, McpHttpProfileTest는 이
# 프로파일에 각각 한정된 컨텍스트로 검증한다).

spring.ai.mcp.server.enabled=true
# stdio는 끄고(mcp 프로파일과 반대) 서블릿 컨테이너로 정상 기동해 HTTP로 노출한다.
spring.ai.mcp.server.stdio=false
# 전송 방식은 스타터 기본값(SSE: GET /sse + POST /mcp/message)을 그대로 쓴다 — 명시 안 해도
# spring.ai.mcp.server.protocol 기본값이 SSE라 별도 설정 불필요.

# 팀원 일반 bootRun(8080)과 충돌하지 않도록 전용 포트. .env의 MCP_HTTP_PORT로 변경 가능.
server.port=${MCP_HTTP_PORT:8081}

# 도구 4종·instructions는 stdio(mcp 프로파일)와 완전히 공유한다 — mcp 패키지의
# McpToolConfig, application.properties의 spring.ai.mcp.server.name/version/instructions를
# 그대로 쓰고 이 파일에서 재정의하지 않는다 (루트 CLAUDE.md "도구 4종·instructions는 stdio와
# 공유(재정의 금지)").

# --- 인증 (범위 밖 — 1차는 localhost 검증용) ---
# 이 프로파일은 로컬 검증용이라 MCP 경로(/sse/**, /mcp/**)에 한해 인증 없이 연다.
# SecurityConfig.java(멤버 1 도메인)는 손대지 않는다 — 대신 McpHttpSecurityConfig
# (mcp 패키지, @Profile("mcp-http") 전용)가 Spring Security의 "다중 SecurityFilterChain"
# 표준 패턴으로 MCP 경로만 별도 체인으로 가로채 permitAll 하고, 나머지 경로는 그대로
# SecurityConfig의 기존 체인(anyRequest().authenticated())을 탄다. 실제 배포 시에는
# 비밀 경로 URL 또는 OAuth로 교체해야 한다(2차, 루트 CLAUDE.md "원격 커넥터 전환 — 단계
# 기획" ② 참고 — 이미 기획만 확정, 구현은 2차).
