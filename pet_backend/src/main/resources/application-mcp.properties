# MCP 대화형 입구 — stdio 전용 프로파일 (루트 CLAUDE.md "Phase: MCP 대화형 입구" 확정사항).
# mcp-server.sh가 --spring.profiles.active=mcp 로 이 jar를 실행할 때만 적용된다.
# 일반 bootRun(기본 프로파일)에는 이 파일의 어떤 값도 영향을 주지 않는다.

# --- MCP 서버 활성화 (원격 커넥터 전환 1차, 2026-08-24 추가) ---
# application.properties가 기본 프로파일 보호를 위해 spring.ai.mcp.server.enabled=false로
# 꺼 두었으므로, stdio를 실제로 쓰는 이 프로파일에서는 다시 켠다.
spring.ai.mcp.server.enabled=true

# --- stdout 오염 방지 (최대 함정) ---
# stdout은 MCP JSON-RPC 프로토콜 채널 그 자체다 — 배너나 로그 한 줄만 섞여도 호스트가
# 응답을 파싱하지 못해 연결이 깨진다.
spring.main.banner-mode=off
# Logback 콘솔 appender를 완전히 무음 처리(레벨 무관 전부 차단) — 로그 자체는 사라지지 않고
# 아래 logging.file.name 설정에 따라 파일로만 남는다.
logging.threshold.console=OFF
logging.file.name=logs/mcp-server.log
# Hibernate show-sql은 로거를 거치지 않고 System.out에 직접 쓰기 때문에 threshold 설정과
# 무관하게 stdout을 오염시킨다 — 기본 application.properties 값(true)을 이 프로파일에서만 끈다.
spring.jpa.show-sql=false

# --- 웹서버 미기동 ---
# 서블릿 컨테이너(8080)를 아예 띄우지 않는다 — stdio는 웹서버가 필요 없고, 개발 중 bootRun과의
# 포트 충돌도 막는다.
#
# 웹 전용 자동구성(SecurityConfig·ChatWebSocketConfig가 기대는 Spring Security/WebSocket
# 서블릿 자동구성)을 별도로 spring.autoconfigure.exclude 하지 않아도 된다는 것을 스모크
# 테스트로 직접 확인했다 — 두 자동구성 모두 자체적으로 @ConditionalOnWebApplication(SERVLET)
# 조건을 갖고 있어서 web-application-type=none이면 스스로 비활성화되고, 기동은 정상 성공한다
# (루트 CLAUDE.md "구현 시 주의"의 대비책이었으나 실제로는 필요하지 않았다 — 만약 팀원이
# SecurityConfig·ChatWebSocketConfig에 무조건 활성 빈을 추가해 다시 기동 실패가 나면, 그때
# 여기에 spring.autoconfigure.exclude=...(SecurityAutoConfiguration 등)를 추가한다).
spring.main.web-application-type=none

# --- MCP 서버 stdio 활성화 ---
spring.ai.mcp.server.stdio=true

# --- 스케줄러 관련 참고 (QA M-2로 정정) ---
# WalkBriefingScheduler는 @Profile("!mcp & !mcp-http")로 이 프로파일에서 아예 등록되지 않는다.
# 이전 판단("등록돼도 무해")은 틀렸다 — 이 프로파일은 대개 KMA_SERVICE_KEY 없이 뜨고, 그러면
# mock 날씨(기온 30℃ 고정)로 hot이 오판정돼 실배포(EC2)가 저장한 최신 판정 행을 덮어쓸 수
# 있었다. WalkBriefingService.runBriefing()에도 같은 이유로 mock 폴백 시 저장을 건너뛰는
# 방어선을 이중으로 두었다(둘 중 하나만 있어도 막히지만, 서비스가 스케줄러 밖의 다른 경로로
# 호출될 가능성까지 대비한다).
