spring.application.name=pet-backend

# .env 파일을 환경변수처럼 불러온다 (파일이 없으면 무시)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL 연결 (값은 .env에서 주입)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Supabase 무료 플랜은 동시 커넥션 제한이 있으므로 풀 크기를 작게 유지
spring.datasource.hikari.maximum-pool-size=5

# JWT (값은 .env에서 주입, docs/conventions.md 4절)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# JPA 설정
# 스키마는 docs/schema.sql 기준으로 Supabase에서 직접 관리 — JPA는 검증만 수행
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
