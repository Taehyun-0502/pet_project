spring.application.name=pet-backend

# .env 파일을 환경변수처럼 불러온다 (파일이 없으면 무시)
spring.config.import=optional:file:.env[.properties]

# Anthropic API (AI 챗봇 함수 호출용) — 실제 키 값은 .env의 ANTHROPIC_API_KEY에만 작성
anthropic.api-key=${ANTHROPIC_API_KEY}
# 모델: 크레딧 절약을 위해 sonnet 사용 (claude-sonnet-5 = 최신 Sonnet 별칭, 코드에 하드코딩 금지)
anthropic.model=claude-sonnet-5

# Supabase PostgreSQL 연결
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# Supabase 무료 플랜은 동시 커넥션 제한이 있으므로 풀 크기를 작게 유지
spring.datasource.hikari.maximum-pool-size=5

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
