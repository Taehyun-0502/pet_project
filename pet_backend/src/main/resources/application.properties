spring.application.name=pet-backend

# .env 파일을 환경변수처럼 불러온다 (파일이 없으면 무시)
spring.config.import=optional:file:.env[.properties]

# Anthropic API (AI 챗봇 함수 호출용) — 실제 키 값은 .env의 ANTHROPIC_API_KEY에만 작성
anthropic.api-key=${ANTHROPIC_API_KEY}
# 모델: 크레딧 절약을 위해 sonnet 사용 (claude-sonnet-5 = 최신 Sonnet 별칭, 코드에 하드코딩 금지)
anthropic.model=claude-sonnet-5

# 카카오 로컬 API (지도/장소 추천, 챗봇 도구 search_places용) — 실제 키 값은 .env의 KAKAO_REST_API_KEY에만 작성
# 주의: 이 줄은 병합(0c5ea7e)에서 유실된 이력이 있다 — 없으면 KakaoClient 기동 실패/PLACE_SEARCH_FAILED
kakao.rest-api-key=${KAKAO_REST_API_KEY:}

# 질병예측 연동 모드 — mock(기본, MockDiseasePredictionClient) | 추후 멤버 3의 FastAPI 실구현체로 교체
prediction.mode=mock

# 기상청 단기예보 조회서비스(공공데이터포털, 산책 아스팔트 온도 안내용) — 실제 키 값은
# .env의 KMA_SERVICE_KEY에만 작성. 비어 있으면 KmaClient가 mock 날씨로 폴백한다(기동 시 경고 로그).
kma.service-key=${KMA_SERVICE_KEY:}

# 산책 브리핑 판정 스케줄러(AI 강아지 관리 비서 Phase v2, WalkBriefingScheduler) cron.
# 안정화 기간은 매일 12:00(KST), 확인 후 18:00로 복귀 예정 — 테스트 중 시각을 바꾸고
# 싶으면 코드가 아니라 .env의 WALK_BRIEFING_CRON에 원하는 cron 표현식을 넣는다.
walk.briefing.cron=${WALK_BRIEFING_CRON:0 55 17 * * *}

# Supabase Storage (숏츠 영상 파일). 업로드는 이 서버만 할 수 있다 —
# service-role 키는 RLS를 무시하는 관리자 키이므로 .env(서버)에만 두고 프론트로 내보내지 않는다.
# 비어 있어도 애플리케이션은 기동하고, 업로드 요청 시점에만 설정 누락을 알린다
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.shorts-bucket=shorts
# 프로필 이미지(회원·반려동물 공용) 버킷 — Supabase 대시보드에서 public 버킷으로 생성해야 한다
supabase.profiles-bucket=profiles
# 채팅 이미지 버킷 (F10b) — 역시 public 버킷으로 생성. 프로필과 나눈 이유는 성격이 다르기 때문이다:
# 프로필은 개체당 1장 덮어쓰기, 채팅 이미지는 대화 기록이라 누적된다(정리 정책도 달라질 것)
supabase.chat-bucket=chat-images

# 업로드 용량. 실제 상한(50MB)은 ShortsService가 검사해 400 + 안내 메시지로 돌려준다.
# 여기 값을 60MB로 조금 높게 둔 이유: 이 한도를 넘으면 컨트롤러에 닿기 전에
# MaxUploadSizeExceededException이 던져져 공용 GlobalExceptionHandler를 고쳐야 500이 아닌 응답을 줄 수 있다.
# 서비스 검사가 먼저 걸리도록 해서 공용 파일을 건드리지 않는다 (60MB 초과는 500으로 떨어지는 극단 케이스)
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=65MB

# Supabase PostgreSQL 연결
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Supabase 무료 플랜은 동시 커넥션 제한이 있으므로 풀 크기를 작게 유지
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

# JWT (값은 .env에서 주입, docs/conventions.md 4절)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# 리프레시 토큰 쿠키의 Secure 속성. 기본은 true(배포는 반드시 true).
# LAN 주소(http://192.168.x.x)로 접속해 테스트할 때만 .env에 COOKIE_SECURE=false를 넣어 끈다 —
# Secure 쿠키는 localhost 외의 평문 HTTP에서는 저장 자체가 되지 않는다 (리뷰 백로그 33번)
app.cookie.secure=${COOKIE_SECURE:true}

# 프론트 오리진 목록 (쉼표 구분) — HTTP CORS(SecurityConfig)와 WebSocket 오리진(ChatWebSocketConfig)이
# **같은 값**을 읽는다. 두 검사는 별개라서 목록이 갈라지면 REST만 되고 실시간(WS)만 조용히 죽는다
# (리뷰 65번에서 한 번, 2026-08-11 LAN 휴대폰 실시간 불통으로 두 번째 실측 — 그래서 단일 출처로 통일).
# LAN 테스트·배포 오리진은 코드가 아니라 각자 .env의 CORS_ALLOWED_ORIGINS로 추가한다 (.env.example 참조)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# JPA 설정
# 스키마는 docs/schema.sql 기준으로 Supabase에서 직접 관리 — JPA는 검증만 수행
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# 카카오 OAuth (소셜 로그인, docs/api-spec.md 1절 4차) — 위 지도용 키와 **별개 앱**이다.
# 빈 기본값: 키가 없어도 부팅은 되고 카카오 로그인 호출 시점에만 실패한다.
# client-secret은 카카오 콘솔에서 Client Secret을 활성화한 경우에만 .env에 채운다
kakao.oauth.client-id=${KAKAO_OAUTH_CLIENT_ID:}
kakao.oauth.client-secret=${KAKAO_OAUTH_CLIENT_SECRET:}

# FastAPI AI 추론 서버 URL (값은 .env의 AI_SERVER_URL에서 주입)
ai.server.url=${AI_SERVER_URL:http://localhost:8000}

# 프론트 웹 서비스 베이스 URL — MCP 도구(mcp 패키지)가 답변에 붙이는 링크의 출처.
# 기본값은 로컬 개발 프론트(Vite dev 서버). 배포 시 .env의 WEB_BASE_URL로 교체.
app.web-base-url=${WEB_BASE_URL:http://localhost:5173}

# MCP 대화형 입구(mcp 패키지, 2026-08-24 기획) 서버 식별 정보 — stdio 활성화 등 프로파일별
# 설정은 application-mcp.properties에 몰아 둔다(일반 bootRun에는 영향 없음).
#
# --- 기본 프로파일 차단 (원격 커넥터 전환 1차, 2026-08-24 추가) ---
# spring-ai-starter-mcp-server-webmvc(build.gradle)를 추가하면서 생긴 위험: 이 스타터는
# spring.ai.mcp.server.enabled 기본값이 true라서, 클래스패스에 있는 것만으로 일반
# bootRun(기본 프로파일, 웹서버 8080)에도 MCP SSE 엔드포인트(/sse, /mcp/message)를 자동
# 노출할 수 있다 — 이 줄로 기본 차단하고, mcp(stdio)·mcp-http 프로파일에서만 다시 켠다
# (application-mcp.properties · application-mcp-http.properties). 증명:
# McpHttpDefaultProfileIsolationTest(기본 프로파일 컨텍스트에 MCP 서버 빈이 없음을 직접 확인).
spring.ai.mcp.server.enabled=false
spring.ai.mcp.server.name=pet-care
spring.ai.mcp.server.version=1.0.0
# 아래 instructions 값은 유니코드 이스케이프(\uXXXX)로 적혀 있다 — 자바 .properties 포맷은
# 값을 ISO-8859-1로 읽어 한글을 그대로 쓰면 stdio 응답에서 깨진다(실제로 확인된 현상,
# 코멘트는 파싱 대상이 아니라 안 깨짐). 내용을 수정할 때는 아래 평문을 고친 뒤
# python3 -c "print(''.join(f'\\u{ord(c):04x}' if ord(c)>0x7f else c for c in '''<새 문장>'''))"
# 로 다시 이스케이프해서 넣는다.
#
# 평문(참고용, 실제로 읽히는 값 아님):
# 너는 Pet Care 서비스의 반려견 산책·건강 도우미다. 반려동물 관련 질문에는 반드시 제공된
# 도구를 사용해 실제 데이터로 답하고, 추측으로 답하지 마라. 답변은 전부 자연어 한국어
# 문장으로만 작성하고, 데이터베이스 컬럼명·enum 값·영문 코드(예: HOSPITAL, DANGER)를
# 그대로 노출하지 마라. 의료적 진단이나 단정을 내리지 말고, 필요하면 "병원 상담을 권해요"
# 수준으로만 안내해라. 도구 결과에 포함된 링크(URL)는 절대 생략하지 말고 답변 끝에 그대로 안내해라.
spring.ai.mcp.server.instructions=\ub108\ub294 Pet Care \uc11c\ube44\uc2a4\uc758 \ubc18\ub824\uacac \uc0b0\ucc45\u00b7\uac74\uac15 \ub3c4\uc6b0\ubbf8\ub2e4. \ubc18\ub824\ub3d9\ubb3c \uad00\ub828 \uc9c8\ubb38\uc5d0\ub294 \ubc18\ub4dc\uc2dc \uc81c\uacf5\ub41c \ub3c4\uad6c\ub97c \uc0ac\uc6a9\ud574 \uc2e4\uc81c \ub370\uc774\ud130\ub85c \ub2f5\ud558\uace0, \ucd94\uce21\uc73c\ub85c \ub2f5\ud558\uc9c0 \ub9c8\ub77c. \ub2f5\ubcc0\uc740 \uc804\ubd80 \uc790\uc5f0\uc5b4 \ud55c\uad6d\uc5b4 \ubb38\uc7a5\uc73c\ub85c\ub9cc \uc791\uc131\ud558\uace0, \ub370\uc774\ud130\ubca0\uc774\uc2a4 \uceec\ub7fc\uba85\u00b7enum \uac12\u00b7\uc601\ubb38 \ucf54\ub4dc(\uc608: HOSPITAL, DANGER)\ub97c \uadf8\ub300\ub85c \ub178\ucd9c\ud558\uc9c0 \ub9c8\ub77c. \uc758\ub8cc\uc801 \uc9c4\ub2e8\uc774\ub098 \ub2e8\uc815\uc744 \ub0b4\ub9ac\uc9c0 \ub9d0\uace0, \ud544\uc694\ud558\uba74 "\ubcd1\uc6d0 \uc0c1\ub2f4\uc744 \uad8c\ud574\uc694" \uc218\uc900\uc73c\ub85c\ub9cc \uc548\ub0b4\ud574\ub77c. \ub3c4\uad6c \uacb0\uacfc\uc5d0 \ud3ec\ud568\ub41c \ub9c1\ud06c(URL)\ub294 \uc808\ub300 \uc0dd\ub7b5\ud558\uc9c0 \ub9d0\uace0 \ub2f5\ubcc0 \ub05d\uc5d0 \uadf8\ub300\ub85c \uc548\ub0b4\ud574\ub77c.
