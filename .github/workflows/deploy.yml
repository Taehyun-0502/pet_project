# main에 올라가면 EC2로 자동 배포한다. (설정·최초 서버 준비는 docs/deploy-ec2.md)
#
# 브랜치 전략: dev(개인 작업) → sub(팀 통합) → **main(배포)**.
# main만 트리거인 이유는 팀 통합 중인 코드가 시연 서버를 깨뜨리지 않게 하는 것이다.
#
# 빌드를 러너에서 하는 이유: 프리티어 t2/t3.micro는 RAM 1GB라 EC2에서 Gradle·Vite 빌드를 돌리면
# 스왑에 걸리거나 OOM으로 죽는다. 러너가 산출물(jar·dist)만 만들어 올린다.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # 코드 변경 없이 재배포하고 싶을 때 (설정만 바꾼 경우 등)

# 배포가 겹치면 jar 교체와 재시작이 뒤섞인다 — 앞 배포가 끝날 때까지 기다린다
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 백엔드 ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 테스트를 여기서 돌리지 않는 이유: PetBackendApplicationTests가 @SpringBootTest라
      # DB·JWT 시크릿이 있어야 컨텍스트가 뜬다. 배포 파이프라인이 팀 공용 DB에 붙는 것은
      # 부작용이 크므로 분리했다 — 개선안은 docs/deploy-ec2.md "남은 항목" 참조
      - name: Build backend jar
        working-directory: pet_backend
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test --no-daemon

      # ---------- 프론트 ----------
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pet_frontend/package-lock.json

      - name: Build frontend
        working-directory: pet_frontend
        env:
          # Vite는 **빌드 시점에 값을 박아 넣는다** — 런타임 환경변수가 아니다.
          # VITE_BACKEND_URL은 프론트와 같은 오리진(https://도메인)으로 둔다:
          # nginx가 /api를 백엔드로 프록시하므로 별도 API 도메인이 필요 없고,
          # config.js의 resolveApiUrl이 원격 주소를 그대로 존중한다(백로그 115번 수정 덕)
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_KAKAO_CLIENT_ID: ${{ secrets.VITE_KAKAO_CLIENT_ID }}
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}
        run: |
          npm ci
          npm run build
          tar -czf ../frontend-dist.tar.gz -C dist .

      # ---------- 전송 ----------
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 호스트 키를 미리 등록 — 없으면 첫 접속에서 대화형 확인을 기다리다 멈춘다
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload artifacts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          JAR=$(ls pet_backend/build/libs/*.jar | grep -v plain | head -1)
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$JAR" "$EC2_USER@$EC2_HOST:/tmp/app.jar"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            frontend-dist.tar.gz "$EC2_USER@$EC2_HOST:/tmp/frontend-dist.tar.gz"

      # ---------- 교체 + 헬스체크 + 실패 시 롤백 ----------
      - name: Release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          # 프론트: 정적 파일 교체 (원자적이지 않지만 새로고침 한 번 범위의 문제라 수용)
          sudo rm -rf /var/www/pet-frontend.new
          sudo mkdir -p /var/www/pet-frontend.new
          sudo tar -xzf /tmp/frontend-dist.tar.gz -C /var/www/pet-frontend.new
          sudo rm -rf /var/www/pet-frontend.old
          if [ -d /var/www/pet-frontend ]; then sudo mv /var/www/pet-frontend /var/www/pet-frontend.old; fi
          sudo mv /var/www/pet-frontend.new /var/www/pet-frontend

          # 백엔드: 직전 jar를 남겨 두고 교체 (롤백 대상)
          if [ -f /opt/pet-backend/app.jar ]; then
            sudo cp -f /opt/pet-backend/app.jar /opt/pet-backend/app.jar.prev
          fi
          sudo install -o root -g root -m 644 /tmp/app.jar /opt/pet-backend/app.jar
          sudo systemctl restart pet-backend

          # 헬스체크: 로그인 엔드포인트가 빈 본문에 400을 주면 웹·시큐리티·JSON 스택이 살아 있다는 뜻.
          # (DB까지 확인하려면 actuator 도입이 필요 — docs "남은 항목")
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 3 \
              -X POST http://127.0.0.1:8080/api/members/login || true)
            if [ "$code" = "400" ]; then ok=1; break; fi
            sleep 2
          done

          if [ "$ok" != "1" ]; then
            echo "::error::헬스체크 실패 — 직전 jar로 롤백한다"
            sudo journalctl -u pet-backend -n 60 --no-pager || true
            if [ -f /opt/pet-backend/app.jar.prev ]; then
              sudo install -o root -g root -m 644 /opt/pet-backend/app.jar.prev /opt/pet-backend/app.jar
              sudo systemctl restart pet-backend
            fi
            exit 1
          fi

          sudo nginx -t && sudo systemctl reload nginx
          rm -f /tmp/app.jar /tmp/frontend-dist.tar.gz
          echo "배포 완료"
          REMOTE
